name: Build and Deploy Twine

on:
  push:
    branches: [ main ]
  repository_dispatch:
    types: [ publish ]          # fired by the Supabase "publish" Edge Function
  schedule:
    - cron: '17 9 * * 1'        # weekly rebuild; also pings Supabase so the free project is not paused
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5

      - name: Verify vendored tools
        run: |
          test -f vendor/tweego/tweego
          test -f vendor/storyformats/sugarcube-2/format.js
          chmod +x vendor/tweego/tweego

      - name: Export student content from Supabase
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          curl -sfS -X POST "$SUPABASE_URL/rest/v1/rpc/export_twee" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" -d '{}' | jq -r . > story/content.twee
          test -s story/content.twee
          grep -q '^:: Start' story/content.twee
          grep -c '^:: ' story/content.twee

      - name: Turn @fromstart flags into links in Start
        run: |
          python3 - <<'PY'
          import re
          p = 'story/content.twee'
          parts = re.split(r'(?m)^(?=:: )', open(p, encoding='utf-8').read())
          flagged, out = [], []
          for part in parts:
              lines = part.split('\n')
              if part.startswith(':: ') and any(l.strip() == '@fromstart' for l in lines):
                  name = re.sub(r'\s*\[[^\]]*\]\s*$', '', lines[0][3:]).strip()
                  flagged.append(name)
                  part = '\n'.join(l for l in lines if l.strip() != '@fromstart')
              out.append(part)
          res = []
          for part in out:
              if re.match(r':: Start\s*(\[[^\]]*\])?\s*\n', part):
                  have = set(re.findall(r'\[\[([^\]|]+)', part))
                  add = [n for n in flagged if n != 'Start' and n not in have]
                  if add:
                      part = part.rstrip('\n') + '\n\n' + '\n'.join('[[' + n + ']]' for n in add) + '\n\n'
              res.append(part)
          open(p, 'w', encoding='utf-8').write(''.join(res))
          print('passages linked from Start via @fromstart:', len(flagged))
          PY
          ! grep -q '^@fromstart' story/content.twee

      - name: Build story
        env:
          TWEEGO_PATH: vendor/storyformats
        run: |
          mkdir -p build
          vendor/tweego/tweego --format=sugarcube-2 -o build/index.html story

      - name: Copy authoring tool
        run: |
          if [ -d author ]; then cp -r author build/author; fi
          if [ -d media ]; then cp -r media build/media; fi
          if [ -d help ]; then cp -r help build/help; fi

      - name: Load author extras
        run: |
          python3 - <<'PY'
          a = 'build/author/index.html'
          t = open(a, encoding='utf-8').read()
          i = t.rfind('</body>')
          if i == -1 or 'extras.js' in t:
              raise SystemExit('could not add extras.js')
          open(a, 'w', encoding='utf-8').write(t[:i] + '<script src="extras.js"></script>\n' + t[i:])
          PY

      - name: Verify output
        run: test -f build/index.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
