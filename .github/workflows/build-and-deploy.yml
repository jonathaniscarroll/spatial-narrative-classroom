name: Build and Deploy Twine

on:
  push:
    branches: [ main ]
  repository_dispatch:
    types: [ publish ]          # fired by the Supabase "publish" Edge Function
  schedule:
    - cron: '17 9 * * 1'        # weekly rebuild; also pings Supabase so the free project is not paused
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5

      - name: Verify vendored tools
        run: |
          test -f vendor/tweego/tweego
          test -f vendor/storyformats/sugarcube-2/format.js
          chmod +x vendor/tweego/tweego

      - name: Export student content from Supabase
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          curl -sfS -X POST "$SUPABASE_URL/rest/v1/rpc/export_twee" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" -d '{}' | jq -r . > story/content.twee
          test -s story/content.twee
          grep -q '^:: Start' story/content.twee
          grep -c '^:: ' story/content.twee

      - name: Build story
        env:
          TWEEGO_PATH: vendor/storyformats
        run: |
          mkdir -p build
          vendor/tweego/tweego --format=sugarcube-2 -o build/index.html story

      - name: Copy authoring tool
        run: |
          if [ -d author ]; then cp -r author build/author; fi
          if [ -d media ]; then cp -r media build/media; fi
          if [ -d help ]; then cp -r help build/help; fi

      - name: Link the help page from the reader and author tool
        run: |
          python3 - <<'PY'
          p = 'build/index.html'
          link = ('<a href="help/" style="position:fixed;right:10px;bottom:10px;z-index:99999;'
                  'background:#d4d0c8;color:#000;font:bold 14px Arial,sans-serif;padding:10px 14px;'
                  'border:2px solid #000;text-decoration:none">Help</a>')
          s = open(p, encoding='utf-8').read()
          i = s.rfind('</body>')
          if i != -1 and 'href="help/"' not in s:
              open(p, 'w', encoding='utf-8').write(s[:i] + link + s[i:])
          a = 'build/author/index.html'
          t = open(a, encoding='utf-8').read()
          old = '  \U0001F5FA Spatial Narrative Author\n'
          new = ('  \U0001F5FA Spatial Narrative Author <a href="../help/" '
                 'style="margin-left:auto;color:#fff;font-weight:bold">Help</a>\n')
          if old in t and '../help/' not in t:
              open(a, 'w', encoding='utf-8').write(t.replace(old, new, 1))
          PY

      - name: Verify output
        run: test -f build/index.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
